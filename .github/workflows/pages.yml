name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify production artifact
        run: |
          test -f dist/index.html
          test -f dist/app.js
          test -f dist/data.js
          test -f dist/styles.css
          test -f dist/assets/sobh-rooyesh-logo.png
          test -f dist/assets/sobh-rooyesh-mark.png
          node --check dist/app.js
          node --check dist/data.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload production site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
